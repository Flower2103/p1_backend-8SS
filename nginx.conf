server {
    listen 80;

    # Proxy para Flask
    location /pagina {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Página principal de nginx
    location / {
        return 200 'Servidor Nginx funcionando';
        add_header Content-Type text/plain;
    }
}

